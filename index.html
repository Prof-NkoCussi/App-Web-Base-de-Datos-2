  <style>
    /* Portada principal: solo se usa en esta página */
    .tapa-pagina { background: var(--blanco, #fff); }
    .tapa { background: var(--blanco, #fff); }
    .tapa {
      position: relative; overflow: hidden;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(18px, 3.2vh, 32px);
      padding: 40px 20px 48px; text-align: center;
    }
    .tapa::before {   /* franja de arriba: los cuatro colores de los módulos */
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; z-index: 1;
      background: linear-gradient(90deg, var(--acento, #26C6D4) 0 25%, var(--diseno, #A78BFA) 25% 50%, var(--sql, #60A5FA) 50% 75%, var(--servidor, #F472B6) 75%);
    }
    .tapa__red {      /* dibujo de fondo: tablas relacionadas */
      position: absolute; width: min(70vw, 520px); height: auto;
      color: var(--acento-claro, #CDEFF4); fill: currentColor; stroke: currentColor;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none;
    }
    .tapa__red--a { left: -90px; top: -60px; }
    .tapa__red--b { right: -110px; bottom: -80px; transform: rotate(180deg); }
    .tapa > :not(.tapa__red) { position: relative; }

    .tapa__iconos { display: flex; justify-content: center; gap: clamp(10px, 3vw, 22px); }
    .tapa__iconos li {
      display: flex; align-items: center; justify-content: center;
      width: clamp(62px, 17vw, 104px); aspect-ratio: 1;
      background: var(--acento-suave, #E2F5F8);
      border: 2px solid var(--acento-claro, #CDEFF4); border-radius: 22%;
    }
    .tapa__iconos .ico { width: 62%; height: 62%; stroke-width: 2.4; }
    .tapa__iconos .m2 .ico { --ac: var(--diseno); }
    .tapa__iconos .m2 { background: var(--diseno-suave); border-color: var(--diseno-claro); }
    .tapa__iconos .m3 .ico { --ac: var(--sql); }
    .tapa__iconos .m3 { background: var(--sql-suave); border-color: var(--sql-claro); }
    .tapa__iconos .m4 .ico { --ac: var(--servidor); }
    .tapa__iconos .m4 { background: var(--servidor-suave); border-color: var(--servidor-claro); }

    .tapa__titulo {
      font-family: var(--fuente-titular, "Barlow Condensed", sans-serif); font-weight: 800;
      font-size: clamp(76px, 22.5vw, 180px); line-height: .84; letter-spacing: -.012em;
      color: var(--tinta, #111827); text-transform: uppercase;
    }
    .tapa__titulo span { color: var(--acento-numero, #05A2B4); }

    .tapa__chip {
      display: inline-block;
      background: var(--acento-numero, #05A2B4); color: var(--blanco, #fff);
      font-family: var(--fuente-titulo, "Barlow Semi Condensed", sans-serif); font-weight: 700;
      font-size: clamp(20px, 5.7vw, 40px); line-height: 1.05;
      padding: .34em .75em .38em; border-radius: 14px;
    }
    .tapa__datos { display: flex; flex-direction: column; gap: 6px; }
    .tapa__profe { color: var(--gris, #5B6472); font-weight: 700; font-size: clamp(16px, 4vw, 22px); }

    .tapa__entrar {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 6px;
      position: relative; isolation: isolate;
      background: transparent; color: var(--blanco, #fff);
      font-weight: 700; font-size: clamp(17px, 4.4vw, 21px); text-decoration: none;
      padding: 14px 26px; border-radius: 12px;
    }
    .tapa__entrar::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: var(--tinta, #111827); border-radius: inherit;
      animation: tapa-pulso 2.4s ease-in-out infinite;
    }
    .tapa__entrar:hover::before { background: #263244; }
    .tapa__entrar:focus-visible { outline: 3px solid var(--acento-numero, #05A2B4); outline-offset: 4px; }
    @keyframes tapa-pulso {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(5, 162, 180, .38); }
      50% { transform: scale(1.035); box-shadow: 0 0 0 9px rgba(5, 162, 180, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tapa__entrar::before { animation: none; }
    }
    .tapa__entrar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    /* Celular acostado */
    @media (max-width: 859px) and (max-height: 560px) and (orientation: landscape) {
      .tapa { gap: 12px; padding: 26px 20px; }
      .tapa__titulo { font-size: clamp(54px, 19vh, 110px); }
      .tapa__iconos li { width: 54px; }
    }
    /* PC e impresión: hoja A4 vertical, como las láminas */
    @media (min-width: 860px), print {
      .tapa-pagina { background: var(--fondo-pantalla, #DDE3E9); }
      .tapa {
        width: 210mm; height: 297mm; min-height: 0;
        margin: 24px auto 48px; padding: 20mm 16mm;
        gap: 11mm;
        box-shadow: 0 2px 14px rgba(17, 24, 39, .14);
      }
      .tapa::before { height: 5mm; }
      .tapa__red { width: 125mm; }
      .tapa__red--a { left: -40mm; top: -24mm; }
      .tapa__red--b { right: -40mm; bottom: -24mm; }
      .tapa__iconos { gap: 7mm; }
      .tapa__iconos li { width: 30mm; }
      .tapa__titulo { font-size: 46mm; }
      .tapa__chip { font-size: 12mm; }
      .tapa__profe { font-size: 6.2mm; }
      .tapa__entrar { font-size: 5.6mm; margin-top: 4mm; }
    }
    @media print {
      .tapa-pagina { background: var(--blanco, #fff); }
      .tapa { margin: 0; box-shadow: none; }
      .tapa__entrar { display: none; }
    }
  </style>
</head>
